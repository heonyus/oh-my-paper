<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>oh-my-paper</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        font: 16px/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 0 1.5rem;
      }
      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.375rem;
      }
      p {
        margin: 0 0 1rem;
      }
      code {
        display: block;
        padding: 0.625rem 0.875rem;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 0.5rem;
        font: 0.9375rem ui-monospace, monospace;
        user-select: all;
      }
      [data-message="stoppedWaiting"] {
        margin-top: 1rem;
        opacity: 0.6;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-48.png" width="48" height="48" alt="" />
      <h1 data-message="stopped">oh-my-paper is not running</h1>
      <p data-message="stoppedBody">Start it from a terminal with the command below.</p>
      <code>oh-my-paper</code>
      <p data-message="stoppedWaiting" aria-live="polite">Waiting for oh-my-paper…</p>
    </main>
    <script src="stopped.js"></script>
  </body>
</html>
