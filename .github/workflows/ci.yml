name: CI

# Runs on Linux only. macOS minutes are billed at 10x and Windows at 2x,
# and the three-OS matrix burned the whole free monthly allowance in one
# weekend. Cross-platform builds still run from release.yml on tag pushes.
on:
  pull_request:

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
